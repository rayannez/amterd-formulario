<div class="container">

    <header class="header">

        <img
            class="logo"
            src="/images/logo_amterd.png"
            alt="AMTERD">

        <div class="title">

            <h1>AMTERD</h1>

            <h2>Ficha de Inscrição do Associado</h2>

        </div>

    </header>

    <form
        class="form"
        [formGroup]="formulario"
        (ngSubmit)="enviarFormulario()">

        <!-- Dados Pessoais -->
        <app-form-section title="Dados Pessoais">
        
            <!-- Linha 1 -->
            <div class="form-row single">
        
                <app-input-field
                    label="Nome Completo"
                    [control]="formulario.controls.nomeCompleto"
                    [required]="true">
                </app-input-field>
        
            </div>
        
            <!-- Linha 2 -->
            <div class="form-row single">
        
                <app-input-field
                    label="Nome da Mãe"
                    [control]="formulario.controls.nomeMae"
                    [required]="true">
                </app-input-field>
        
            </div>
        
            <!-- Linha 3 -->
            <div class="form-row three-columns">
        
                <app-input-field
                    label="Data de Nascimento"
                    type="date"
                    [control]="formulario.controls.dataNascimento">
                </app-input-field>
        
                <app-select-field
                    label="Sexo"
                    [control]="formulario.controls.sexo"
                    [options]="selectOptions.gender">
                </app-select-field>
        
                <app-select-field
                    label="Estado Civil"
                    [control]="formulario.controls.estadoCivil"
                    [options]="selectOptions.civilStatus">
                </app-select-field>
        
            </div>
        
        </app-form-section>

        <!-- Documentos -->

        <app-form-section title="Documentos">

            <div class="form-row three-columns">

                <app-input-field
                    label="RG"
                    mask="rg"
                    placeholder="00.000.000-0"
                    [control]="formulario.controls.rg">
                </app-input-field>

                <app-select-field
                    label="Órgão Emissor"
                    [control]="formulario.controls.orgaoEmissor"
                    [options]="selectOptions.issuingAuthority">
                </app-select-field>

                <app-input-field
                    label="CPF"
                    mask="cpf"
                    placeholder="000.000.000-00"
                    [control]="formulario.controls.cpf">
                </app-input-field>

            </div>

        </app-form-section>

        <!-- Endereço -->
         
        <app-form-section title="Endereço">
        
            <div class="form-row two-columns">
        
                <app-input-field
                    label="Endereço"
                    [control]="formulario.controls.endereco">
                </app-input-field>
        
                <app-input-field
                    label="Número"
                    [control]="formulario.controls.numero">
                </app-input-field>
        
            </div>
        
            <div class="form-row two-columns">
        
                <app-input-field
                    label="Complemento"
                    [control]="formulario.controls.complemento">
                </app-input-field>
        
                <app-input-field
                    label="Bairro"
                    [control]="formulario.controls.bairro">
                </app-input-field>
        
            </div>
        
            <div class="form-row three-columns">
        
                <app-input-field
                    label="Cidade"
                    [control]="formulario.controls.cidade">
                </app-input-field>
        
                <app-select-field
                    label="UF"
                    [control]="formulario.controls.uf"
                    [options]="selectOptions.uf">
                </app-select-field>
        
                <app-input-field
                [control]="formulario.controls.cep"
                label="CEP"
                mask="cep"
                placeholder="00000-000"
                [required]="true"
                (blur)="onCepBlur()">
                </app-input-field>
        
            </div>
        
        </app-form-section>

        <!-- Contato -->

        <app-form-section title="Contato">
        
            <div class="form-row three-columns">
        
                <app-input-field
                    label="Telefone"
                    mask="telefone"
                    placeholder="(00) 00000-0000"
                    [control]="formulario.controls.telefone">
                </app-input-field>
        
                <app-input-field
                    label="Celular"
                    [control]="formulario.controls.celular">
                </app-input-field>
        
                <app-input-field
                    label="E-mail"
                    type="email"
                    [control]="formulario.controls.email">
                </app-input-field>
        
            </div>
        
        </app-form-section>

        <!-- Declarações -->

        <app-form-section title="Declarações">
        
            <app-checkbox-field
                label="Solicito minha inclusão no quadro de associados da AMTERD."
                [control]="formulario.controls.aceitaInclusao">
            </app-checkbox-field>
        
            <app-checkbox-field
                label="Declaro que todas as informações prestadas são verdadeiras."
                [control]="formulario.controls.declaraInformacoes">
            </app-checkbox-field>
        
            <app-checkbox-field
                label="Comprometo-me a comunicar qualquer alteração dos dados."
                [control]="formulario.controls.declaraResponsabilidade">
            </app-checkbox-field>
        
            <app-checkbox-field
                label="Autorizo o tratamento dos meus dados para fins de cadastro."
                [control]="formulario.controls.autorizaUsoDados">
            </app-checkbox-field>
        
        </app-form-section>

        <!-- Informações sobre a Mensalidade -->

        <section class="payment-info">

            <h3>Informações sobre a Mensalidade</h3>
        
            <p>
                O pagamento da mensalidade deverá ser realizado
                <strong>até o dia 15 de cada mês.</strong>
            </p>
        
            <div class="payment-row">
                <strong>Chave PIX:</strong>
                <span>associacaoamterd@gmail.com</span>
            </div>
        
            <div class="payment-row">
                <strong>Mercado Pago</strong>
            </div>
        
        </section>

        <!-- Assinatura -->

        <app-form-section title="Assinatura">
        
            <div class="form-row two-columns">
        
                <app-input-field
                    label="Local"
                    [control]="formulario.controls.local">
                </app-input-field>
        
                <app-input-field
                    label="Data"
                    type="date"
                    [control]="formulario.controls.dataAssinatura">
                </app-input-field>
        
            </div>
        
            <div class="form-row single">
        
                <app-input-field
                    label="Assinatura"
                    [control]="formulario.controls.assinatura">
                </app-input-field>
        
            </div>
        
        </app-form-section>

        <!-- Botão de Envio -->

        <div class="submit-container">
            <button
            mat-raised-button
            type="submit"
            class="submit-button"
            [disabled]="isSubmitting">
            @if (isSubmitting) {
                <mat-spinner diameter="20"></mat-spinner>
                <span>Enviando...</span>
            } @else {
                <span>Enviar inscrição</span>
            }
        </button>
        </div>

    </form>

</div>
