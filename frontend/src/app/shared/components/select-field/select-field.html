<mat-form-field appearance="outline">
    <mat-label [class.required]="required()">{{ label() }}</mat-label>
    <mat-select 
        [formControl]="control()"
        [disabled]="readonly()"
        disableOptionCentering
        panelClass="mobile-select">
        @for (option of options(); track option.value) {
            <mat-option [value]="option.value">
                {{ option.label }}
            </mat-option>
        }
    </mat-select>
    @if (hasError()) {
        <mat-error>
            {{ getErrorMessage() }}
        </mat-error>
    }
</mat-form-field>
