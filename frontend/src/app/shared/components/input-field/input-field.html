<mat-form-field class="mat-mdc-form-field" appearance="outline">
    <mat-label>{{ label() }}</mat-label>
    <input
        matInput
        [type]="type()"
        [formControl]="control()"
        [placeholder]="placeholder()"
        [readonly]="readonly()"
        [maxlength]="maxLength() ?? ''"
        (blur)="onBlur()"
        (input)="onInput($event)"
        autocomplete="off">
    @if (hasError()) {
        <mat-error>
            {{ getErrorMessage() }}
        </mat-error>
    }
</mat-form-field>
